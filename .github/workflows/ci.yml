name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  hygiene:
    name: Repo hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: bash scripts/check-repo-hygiene.sh

  contract:
    name: Contract
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - name: Install stellar-cli 28.0.0 (pinned, checksum-verified)
        # soroban-sdk 29 only builds WASM through stellar-cli (25.2+).
        run: |
          mkdir -p "$HOME/.local/bin"
          curl --proto '=https' --tlsv1.2 -sSfL -o /tmp/stellar-cli.tgz \
            https://github.com/stellar/stellar-cli/releases/download/v28.0.0/stellar-cli-28.0.0-x86_64-unknown-linux-gnu.tar.gz
          echo "207544486734fccb4df1afc4a7745478f9f1e21688b2f9506f0ef36f60ce3fdc  /tmp/stellar-cli.tgz" | sha256sum -c -
          tar -xzf /tmp/stellar-cli.tgz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: stellar contract build --locked

  typescript:
    name: TypeScript
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: agentflow
          POSTGRES_PASSWORD: agentflow-dev
          POSTGRES_DB: agentflow_test
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U agentflow" --health-interval 2s --health-timeout 5s --health-retries 20
    env:
      AGENTFLOW_TEST_DATABASE_URL: postgres://agentflow:agentflow-dev@127.0.0.1:55432/agentflow_test
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "22.23"
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @agentflow/web build
