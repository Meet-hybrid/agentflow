name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Security issue? Do not file it here; use private vulnerability reporting (see SECURITY.md)."
  - type: textarea
    id: what
    attributes: { label: What happened, description: "Include task id / transaction hash if relevant." }
    validations: { required: true }
  - type: textarea
    id: expected
    attributes: { label: What you expected }
    validations: { required: true }
  - type: textarea
    id: repro
    attributes: { label: Steps to reproduce }
    validations: { required: true }
  - type: input
    id: component
    attributes: { label: Component, placeholder: "contract / api / web / agent / docs" }
